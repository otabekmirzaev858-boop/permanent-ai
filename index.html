<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model AI Workbench</title>
    <style>
        :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #181825;
            --bg-surface: #313244;
            --text-primary: #cdd6f4;
            --text-muted: #a6adc8;
            --accent: #89b4fa;
            --accent-hover: #b4befe;
            --border-color: #45475a;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-code: "JetBrains Mono", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 300px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .btn-new-chat {
            background-color: var(--accent);
            color: var(--bg-secondary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-new-chat:hover {
            background-color: var(--accent-hover);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--bg-surface);
            color: var(--text-primary);
        }

        /* Config Panel */
        .config-panel {
            background-color: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.85rem;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-group label {
            color: var(--text-muted);
        }

        .config-group select, .config-group input {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        /* Main Viewport */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-card {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-radius: 8px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .message-card.user {
            background-color: var(--bg-surface);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .avatar.user { background-color: #f5e0dc; color: #11111b; }
        .avatar.assistant { background-color: var(--accent); color: #11111b; }

        .message-content {
            flex: 1;
            line-height: 1.6;
        }

        /* Input Controls */
        .input-bar {
            padding: 20px 20%;
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            max-height: 150px;
        }

        .btn-send {
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            color: var(--bg-secondary);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="btn-new-chat" id="newChatBtn">New Thread</button>
        <div class="history-list" id="historyList"></div>
        
        <div class="config-panel">
            <div class="config-group">
                <label for="providerSelect">Target Provider</label>
                <select id="providerSelect">
                    <option value="openai">OpenAI (ChatGPT)</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="google">Google (Gemini)</option>
                    <option value="higgsfield">Higgsfield AI (Video/Media)</option>
                </select>
            </div>
            <div class="config-group">
                <label for="apiKeyInput">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key...">
            </div>
        </div>
    </div>

    <div class="main-workspace">
        <div class="chat-viewport" id="chatViewport"></div>
        <div class="input-bar">
            <div class="input-container">
                <textarea id="promptInput" rows="1" placeholder="Type your message..."></textarea>
                <button class="btn-send" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
